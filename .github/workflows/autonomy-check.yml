name: تشغيل سير عمل فحص استقلالية الذكاء الاصطناعي من ZOZ

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  autonomy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check production health, business layer, and autonomous cycle security
        env:
          BASE_URL: https://zoz-ai-control.vercel.app
        run: |
          set -euo pipefail
          echo "== Health =="
          curl --fail --silent --show-error --max-time 60 "$BASE_URL/api/health" | tee /tmp/health.json
          echo
          echo "== Self test =="
          curl --fail --silent --show-error --max-time 60 "$BASE_URL/api/self-test" | tee /tmp/self-test.json
          echo
          echo "== Business summary =="
          curl --fail --silent --show-error --max-time 60 "$BASE_URL/api/business/summary" | tee /tmp/business.json
          echo
          echo "== Automation status =="
          curl --fail --silent --show-error --max-time 60 "$BASE_URL/api/automation/status" | tee /tmp/automation.json
          echo
          echo "== Financial approval gate =="
          curl --fail --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' \
            -d '{"type":"payment","title":"CI security probe","description":"Automated safety-boundary check","payload":{"amount":1}}' \
            "$BASE_URL/api/jobs" | tee /tmp/financial.json
          echo
          echo "== Safe action planner =="
          curl --fail --silent --show-error --max-time 60 \
            -H 'Content-Type: application/json' \
            -d '{"type":"internal","title":"CI safe action probe","description":"Automated safe-action readiness check"}' \
            "$BASE_URL/api/jobs" | tee /tmp/safe.json
          echo
          echo "== Autonomous cycle security =="
          STATUS=$(curl --silent --show-error --max-time 60 -o /tmp/cycle.json -w '%{http_code}' "$BASE_URL/api/automation/cycle")
          cat /tmp/cycle.json
          echo
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "503" ]; then
            echo "Expected protected autonomous cycle endpoint to reject unauthenticated requests; got HTTP $STATUS"
            exit 1
          fi
          echo "Unauthenticated autonomous cycle correctly blocked (HTTP $STATUS)."

      - name: Validate autonomous core and safety boundaries
        run: |
          set -euo pipefail
          node --check server.js
          node --check business.js
          node business.test.js
          node whatsapp_crm.test.js

      - name: Complete job
        run: echo "ZOZ AI autonomy and safety checks completed successfully."
