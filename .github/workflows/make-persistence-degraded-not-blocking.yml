name: Make persistence degraded not blocking
on:
  push:
    paths:
      - .github/trigger-persistence-fallback.txt
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update readiness policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old='if (["needs_setup", "configured_unverified", "error"].includes(connector.status) && !["github", "vercel"].includes(id)) blockers.push({ id, status: connector.status, priority: id === "database" ? 1 : id === "whatsapp" ? 2 : 3, owner: "user", action: connector.status === "configured_unverified" ? `تشغيل التحقق الفعلي لـ ${connector.label}` : `إكمال اعتماد ${connector.label}` });'
          new='if (id === "database" && connector.status === "needs_setup") continue; if (["needs_setup", "configured_unverified", "error"].includes(connector.status) && !["github", "vercel"].includes(id)) blockers.push({ id, status: connector.status, priority: id === "whatsapp" ? 2 : 3, owner: "user", action: connector.status === "configured_unverified" ? `تشغيل التحقق الفعلي لـ ${connector.label}` : `إكمال اعتماد ${connector.label}` });'
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate
        run: node --check server.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.js
          git commit -m "Treat missing persistence as degraded not blocking" || exit 0
          git push
      - name: Remove workflow
        run: |
          rm -f .github/workflows/make-persistence-degraded-not-blocking.yml .github/trigger-persistence-fallback.txt
          git add -A
          git commit -m "Remove temporary persistence fallback workflow" || exit 0
          git push
