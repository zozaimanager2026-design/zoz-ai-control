name: ZOZ AI Optional Connectors Status

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Check production readiness without blocking core
        env:
          BASE_URL: https://zoz-ai-control-production.up.railway.app
        run: |
          set -e
          echo "Checking ZOZ AI production core..."
          curl -fsS --retry 3 "$BASE_URL/api/health" >/tmp/health.json
          curl -fsS --retry 3 "$BASE_URL/api/self-test" >/tmp/self-test.json
          curl -fsS --retry 3 "$BASE_URL/api/readiness" >/tmp/readiness.json
          echo "Core runtime and self-test are healthy."
          echo "Optional external connectors are intentionally non-blocking here."
          echo "Financial operations remain human-approval only."
