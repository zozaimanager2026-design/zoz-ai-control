name: Apply safe persistence fallback
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply KV fallback and secure cycle UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          old = '''const persistence = {\n  enabled: Boolean(process.env.KV_REST_API_URL && process.env.KV_REST_API_TOKEN),\n  key: process.env.ZOZ_STATE_KEY || "zoz-ai:state"\n};'''
          new = '''const KV_REST_API_URL = process.env.KV_REST_API_URL || process.env.ZOZ_KV_REST_API_URL;\nconst KV_REST_API_TOKEN = process.env.KV_REST_API_TOKEN || process.env.ZOZ_KV_REST_API_TOKEN;\n\nconst persistence = {\n  enabled: Boolean(KV_REST_API_URL && KV_REST_API_TOKEN),\n  key: process.env.ZOZ_STATE_KEY || "zoz-ai:state"\n};'''
          if old not in s:
              raise SystemExit('persistence block not found')
          s = s.replace(old, new, 1)
          s = s.replace('process.env.KV_REST_API_URL.replace(/\\/$/, "")', 'KV_REST_API_URL.replace(/\\/$/, "")')
          s = s.replace('process.env.KV_REST_API_TOKEN}', 'KV_REST_API_TOKEN}')
          p.write_text(s)

          ui = Path('public/index.html')
          u = ui.read_text()
          u = u.replace('<button id="cycleButton" onclick="runCycle()">تشغيل دورة الاستقلالية الآن</button>', '<button id="cycleButton" onclick="checkCycleStatus()">فحص دورة الاستقلالية</button>')
          marker = 'async function runCycle() {'
          if marker in u and 'async function checkCycleStatus()' not in u:
              fn = '''async function checkCycleStatus() {\n  const box = document.getElementById("cycleResult");\n  box.textContent = "جاري فحص حالة دورة الاستقلالية...";\n  try {\n    const data = await getJson("/api/automation/status");\n    box.textContent = JSON.stringify({ ok: true, note: "الدورة محمية وتعمل عبر Vercel Cron؛ التشغيل اليدوي العام غير مسموح دون اعتماد آمن.", status: data }, null, 2);\n  } catch (error) {\n    box.textContent = `تعذر فحص حالة الدورة: ${error.message}`;\n  }\n}\n\n'''
              u = u.replace(marker, fn + marker, 1)
          ui.write_text(u)

          env = Path('.env.example')
          if env.exists():
              e = env.read_text()
              if 'ZOZ_KV_REST_API_URL' not in e:
                  e += '\n# Optional fallback names when managed KV variables are not provisioned in Production\nZOZ_KV_REST_API_URL=\nZOZ_KV_REST_API_TOKEN=\n'
                  env.write_text(e)
          PY

          git config user.name 'ZOZ AI Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/index.html .env.example
          git rm .github/workflows/apply-safe-persistence-fallback.yml
          git commit -m 'Add production KV fallback and secure cycle UI'
          git push
