name: Relax Persistence Blocker
on:
  workflow_dispatch:
  push:
    paths:
      - .github/zoz-relax-persistence.txt
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make persistence optional for core readiness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          old = 'function readiness() { const blockers = []; for (const [id, connector] of Object.entries(state.connectors)) { if (["needs_setup", "configured_unverified", "error"].includes(connector.status) && !["github", "vercel"].includes(id)) blockers.push({ id, status: connector.status, priority: id === "database" ? 1 : id === "whatsapp" ? 2 : 3, owner: "user", action: connector.status === "configured_unverified" ? `تشغيل التحقق الفعلي لـ ${connector.label}` : `إكمال اعتماد ${connector.label}` }); } blockers.sort((a, b) => a.priority - b.priority); return { ok: blockers.length === 0, service: ZOZ_NAME, core: "healthy", persistence: persistence.enabled ? "enabled" : "memory_only", financialApprovalRequired: true, autonomy: true, blockers, business: business.businessSummary(state.business), approvalsPending: state.approvals.filter((item) => item.status === "pending").length }; }'
          new = 'function readiness() { const blockers = []; const degraded = []; for (const [id, connector] of Object.entries(state.connectors)) { if (id === "database" && connector.status === "needs_setup") { degraded.push({ id, status: "memory_only", label: connector.label, priority: 1, owner: "user", action: "إضافة KV Production عند الحاجة للتخزين الدائم", note: "قاعدة البيانات اختيارية لاستمرار التشغيل الآمن؛ الحالة الحالية لا تُعتبر تخزينًا دائمًا." }); continue; } if (["needs_setup", "configured_unverified", "error"].includes(connector.status) && !["github", "vercel"].includes(id)) blockers.push({ id, status: connector.status, priority: id === "whatsapp" ? 2 : 3, owner: "user", action: connector.status === "configured_unverified" ? `تشغيل التحقق الفعلي لـ ${connector.label}` : `إكمال اعتماد ${connector.label}` }); } blockers.sort((a, b) => a.priority - b.priority); return { ok: blockers.length === 0, service: ZOZ_NAME, core: "healthy", persistence: persistence.enabled ? "enabled" : "memory_only", persistencePermanent: persistence.enabled, degraded, financialApprovalRequired: true, autonomy: true, blockers, business: business.businessSummary(state.business), approvalsPending: state.approvals.filter((item) => item.status === "pending").length }; }'
          if old not in s:
            raise SystemExit('readiness target not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Document fallback
        shell: bash
        run: |
          cat >> BLOCKER_PLAYBOOK.md <<'EOF'

## Persistence fallback

KV/Upstash is optional for core operation. When Production KV credentials are unavailable, ZOZ AI continues in `memory_only` mode and explicitly reports persistence as degraded rather than blocking the core readiness result. This does not claim durable storage; adding Production KV later automatically enables persistence through the existing environment-variable fallback.
EOF
      - name: Validate
        run: node --check server.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js BLOCKER_PLAYBOOK.md
          git commit -m "Make persistence optional for core readiness" || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/relax-persistence-blocker.yml .github/zoz-relax-persistence.txt
          git add -A
          git commit -m "Remove temporary persistence workflow" || exit 0
          git push
