<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>ZOZ AI — Free Image Lab</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07111f;color:#eef6ff}main{max-width:720px;margin:auto;padding:22px}.card{background:#0d1b2a;border:1px solid #1b3652;border-radius:20px;padding:18px;box-shadow:0 12px 40px #0005}h1{margin:0 0 6px;font-size:28px}p{color:#a9bfd6;line-height:1.6;margin:8px 0 16px}label{display:block;margin:12px 0 6px;color:#d9e7f5;font-weight:600}input,textarea,button{width:100%;border-radius:14px;border:1px solid #284764;background:#081522;color:#fff;padding:13px;font:inherit}textarea{min-height:120px;resize:vertical}button{margin-top:14px;background:#0b7cff;border:0;font-weight:700}button:disabled{opacity:.55}small{color:#87a3bf}.status{margin-top:14px;padding:12px;border-radius:12px;background:#091624;white-space:pre-wrap}.preview{margin-top:16px;border-radius:16px;overflow:hidden;background:#050b12}.preview img{display:block;width:100%;height:auto}.tag{display:inline-block;padding:6px 10px;border:1px solid #264766;border-radius:999px;font-size:12px;color:#a9d3ff;margin:4px 4px 0 0}
</style>
</head>
<body>
<main>
<div class="card">
<h1>ZOZ AI — Free Image Lab</h1>
<p>مولد خفيف مستقل خارج جلسة ChatGPT. يستخدم طبقة ZOZ AI الحالية، ويمنع التشغيل المدفوع من هذه الصفحة.</p>
<div><span class="tag">Kaggle Free GPU أولًا</span><span class="tag">512×512</span><span class="tag">خطوات خفيفة</span><span class="tag">لا حفظ للمفتاح</span></div>
<label for="secret">مفتاح التشغيل</label>
<input id="secret" type="password" autocomplete="off" placeholder="Bearer secret">
<label for="prompt">وصف الصورة</label>
<textarea id="prompt">ZOZ AI premium futuristic business operating system visual, dark high-contrast technology interface, electric blue and cyan accents, clean geometric composition, sophisticated minimal style, subtle glass and metal surfaces, intelligent system network, no readable text, square composition</textarea>
<button id="go">توليد مجاني خفيف</button>
<div id="status" class="status">جاهز.</div>
<div id="preview" class="preview" hidden><img id="img" alt="ZOZ AI generated image"></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
$("go").onclick=async()=>{
 const secret=$("secret").value.trim(), prompt=$("prompt").value.trim();
 if(!secret||!prompt){$("status").textContent="أدخل مفتاح التشغيل والوصف.";return}
 $("go").disabled=true;$("status").textContent="جاري التوليد عبر طبقة ZOZ المجانية…";
 $("preview").hidden=true;
 try{
  const r=await fetch("/api/renderers/image",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+secret},body:JSON.stringify({prompt,width:512,height:512,num_inference_steps:12,guidance_scale:4,paidExecutionApproved:false,humanApproval:false})});
  const b=await r.json().catch(()=>({}));
  if(!r.ok){$("status").textContent="فشل: "+(b.reason||b.error||("HTTP "+r.status));return}
  const url=b.imageUrl||b.asset?.url||null;
  $("status").textContent="تم التوليد. المزود: "+(b.provider||b.providerId||"ZOZ")+(b.executionMode?"\nالنمط: "+b.executionMode:"")+(b.billing?"\nالتكلفة المقدّرة: "+b.billing.totalEgp+" EGP":"");
  if(url){$("img").src=url;$("preview").hidden=false}
  else if(b.imageBase64){$("img").src=b.imageBase64;$("preview").hidden=false}
 }catch(e){$("status").textContent="تعذر الاتصال: "+e.message}
 finally{$("go").disabled=false}
};
</script>
</body>
</html>
