<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><title>ZOZ AI Control</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f1f5f9;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.top{background:#0b1220;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800;font-size:18px}.status{font-size:12px;background:#166534;padding:6px 9px;border-radius:999px}.frame{flex:1;border:0;width:100%;min-height:0;background:#fff}.bar{height:68px;background:#0b1220;color:#fff;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));gap:3px}.bar button{border:0;background:transparent;color:#cbd5e1;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px}.bar button.active{background:#1e293b;color:#fff}.bar b{font-size:19px}.install{position:fixed;left:12px;right:12px;bottom:82px;background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:12px;box-shadow:0 8px 30px #0002;display:none;z-index:20}.install button{background:#0b1220;color:#fff;border:0;border-radius:9px;padding:10px 14px}.install .close{background:#e2e8f0;color:#111;margin-right:6px}.approval-panel{display:none;position:fixed;top:58px;left:10px;right:10px;max-height:48vh;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:14px;box-shadow:0 10px 35px #0003;z-index:15;padding:12px}.approval-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.approval-head strong{font-size:16px}.approval-item{background:#f8fafc;border-radius:10px;padding:10px;margin:8px 0;border:1px solid #e2e8f0}.approval-item .title{font-weight:700}.approval-item .meta{font-size:12px;color:#64748b;margin:5px 0}.approval-item button{border:0;border-radius:8px;padding:8px 11px;margin-left:5px;margin-top:5px;font:inherit}.approve{background:#166534;color:#fff}.reject{background:#991b1b;color:#fff}.execute{background:#0b1220;color:#fff}.refresh{background:#e2e8f0;color:#111}.empty{color:#64748b;font-size:13px;padding:8px}.toast{position:fixed;left:12px;right:12px;bottom:78px;background:#0b1220;color:#fff;padding:10px 12px;border-radius:10px;display:none;z-index:30;font-size:13px}
</style></head>
<body>
<header class="top"><div class="brand">ZOZ AI Control</div><div class="status" id="status">جاري الاتصال…</div></header>
<div class="approval-panel" id="approvalPanel">
  <div class="approval-head"><strong>مركز الموافقات والتحكم</strong><button class="refresh" onclick="loadApprovals()">تحديث</button></div>
  <div id="approvalList" class="empty">جاري تحميل الموافقات…</div>
</div>
<iframe id="frame" class="frame" src="/" title="لوحة ZOZ AI"></iframe>
<nav class="bar">
<button class="active" onclick="go('home',this)"><b>⌂</b>الرئيسية</button>
<button onclick="go('leads',this)"><b>👤</b>العملاء</button>
<button onclick="go('orders',this)"><b>📦</b>الطلبات</button>
<button onclick="go('social',this)"><b>📣</b>السوشيال</button>
<button onclick="go('blockers',this)"><b>⚠</b>العوائق</button>
</nav>
<div class="install" id="install"><strong>ثبّت ZOZ AI على الهاتف</strong><p>أضف لوحة التحكم كتطبيق مستقل للوصول إليها من أي وقت.</p><button id="installBtn">تثبيت التطبيق</button><button class="close" onclick="document.getElementById('install').style.display='none'">لاحقًا</button></div>
<div class="toast" id="toast"></div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
const frame=document.getElementById('frame');
const panel=document.getElementById('approvalPanel');
const toast=document.getElementById('toast');
function notify(text){toast.textContent=text;toast.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.style.display='none',2500)}
function scrollToSection(target){try{const doc=frame.contentDocument;const heads=[...doc.querySelectorAll('section h2')];const terms={leads:['العملاء المحتملون'],orders:['الطلبات والفرص'],blockers:['العوائق والخطوة التالية']};const h=heads.find(x=>(terms[target]||[]).some(t=>x.textContent.includes(t)));if(h){h.scrollIntoView({behavior:'smooth',block:'start'});return true}}catch(e){}return false}
function go(name,btn){document.querySelectorAll('.bar button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(name==='home'){frame.src='/';return}if(name==='social'){window.open('https://app.upload-post.com/dashboard','_blank','noopener');return}if(!scrollToSection(name)){setTimeout(()=>scrollToSection(name),500)}}
async function loadApprovals(){try{const jobs=await fetch('/api/jobs').then(r=>r.json());const pending=jobs.filter(j=>['approval_required','approved'].includes(j.status));document.getElementById('approvalList').innerHTML=pending.length?pending.map(j=>{const safe=!j.financial;return `<div class="approval-item"><div class="title">${esc(j.title)}</div><div>${esc(j.description||'')}</div><div class="meta">الحالة: ${esc(j.status)} ${j.financial?'• إجراء مالي/حساس':''}</div>${j.status==='approval_required'?`<button class="approve" onclick="jobAction('${j.id}','approve')">✓ قبول</button><button class="reject" onclick="jobAction('${j.id}','reject')">✕ رفض</button>`:''}${j.status==='approved'?`<button class="execute" onclick="jobAction('${j.id}','execute')">▶ تنفيذ</button>`:''}</div>`}).join(''):'<div class="empty">لا توجد موافقات معلقة الآن.</div>'}catch(e){document.getElementById('approvalList').textContent='تعذر تحميل الموافقات';}}
async function jobAction(id,action){try{const r=await fetch(`/api/jobs/${encodeURIComponent(id)}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const data=await r.json().catch(()=>({}));if(!r.ok){notify(data.error||'تعذر تنفيذ الأمر');return}notify(action==='approve'?'تم القبول':action==='reject'?'تم الرفض':data.note||'تم التنفيذ');await loadApprovals();}catch(e){notify('تعذر الاتصال بالنظام')}}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='ZOZ_READY')document.getElementById('status').textContent='متصل'});
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install').style.display='block'});document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install').style.display='none'};
fetch('/api/health').then(r=>{if(r.ok)document.getElementById('status').textContent='يعمل'}).catch(()=>document.getElementById('status').textContent='غير متصل');
loadApprovals();setInterval(loadApprovals,15000);
</script></body></html>
