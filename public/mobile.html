<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><title>ZOZ AI Control</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f1f5f9;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.top{background:#0b1220;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800;font-size:18px}.status{font-size:12px;background:#166534;padding:6px 9px;border-radius:999px}.frame{flex:1;border:0;width:100%;min-height:0;background:#fff}.bar{height:68px;background:#0b1220;color:#fff;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));gap:3px}.bar button{border:0;background:transparent;color:#cbd5e1;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px}.bar button.active{background:#1e293b;color:#fff}.bar b{font-size:19px}.install{position:fixed;left:12px;right:12px;bottom:82px;background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:12px;box-shadow:0 8px 30px #0002;display:none;z-index:5}.install button{background:#0b1220;color:#fff;border:0;border-radius:9px;padding:10px 14px}.install .close{background:#e2e8f0;color:#111;margin-right:6px}
</style></head>
<body>
<header class="top"><div class="brand">ZOZ AI Control</div><div class="status" id="status">جاري الاتصال…</div></header>
<iframe id="frame" class="frame" src="/" title="لوحة ZOZ AI"></iframe>
<nav class="bar">
<button class="active" onclick="go('home',this)"><b>⌂</b>الرئيسية</button>
<button onclick="go('leads',this)"><b>👤</b>العملاء</button>
<button onclick="go('orders',this)"><b>📦</b>الطلبات</button>
<button onclick="go('social',this)"><b>📣</b>السوشيال</button>
<button onclick="go('blockers',this)"><b>⚠</b>العوائق</button>
</nav>
<div class="install" id="install"><strong>ثبّت ZOZ AI على الهاتف</strong><p>أضف لوحة التحكم كتطبيق مستقل للوصول إليها من أي وقت.</p><button id="installBtn">تثبيت التطبيق</button><button class="close" onclick="document.getElementById('install').style.display='none'">لاحقًا</button></div>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
const frame=document.getElementById('frame');
function go(name,btn){document.querySelectorAll('.bar button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(name==='home'){frame.src='/';return}frame.contentWindow.postMessage({type:'ZOZ_NAV',target:name},location.origin)}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='ZOZ_READY')document.getElementById('status').textContent='متصل'});
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install').style.display='block'});document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('install').style.display='none'};
fetch('/api/health').then(r=>{if(r.ok)document.getElementById('status').textContent='يعمل'}).catch(()=>document.getElementById('status').textContent='غير متصل');
</script></body></html>
