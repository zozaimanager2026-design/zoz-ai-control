<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>ZOZ AI — Execution</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#f3f4f6;padding:16px}main{max-width:720px;margin:auto}h1{font-size:24px}.card{background:#151c31;border:1px solid #29324d;border-radius:16px;padding:14px;margin:12px 0}button,input,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #39445f;background:#0f172a;color:#fff;margin-top:8px}button{cursor:pointer}.ok{color:#86efac}.warn{color:#facc15}.muted{color:#a5b4fc;font-size:13px}.task{border-top:1px solid #29324d;padding:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><main><h1>ZOZ AI — Digital Execution</h1><div class="card"><div id="status">جاري قراءة حالة الاستقلالية...</div><div class="grid"><button onclick="refresh()">تحديث</button><button onclick="cycle()">تشغيل دورة الآن</button></div></div><div class="card"><h3>استلام مهمة</h3><input id="title" placeholder="عنوان المهمة"><textarea id="description" placeholder="تفاصيل المطلوب"></textarea><input id="clientRef" placeholder="مرجع العميل (اختياري)"><button onclick="createTask()">إدخال المهمة إلى ZOZ AI</button></div><div class="card"><h3>المهارات</h3><div id="skills" class="muted"></div></div><div class="card"><h3>المهام الأخيرة</h3><div id="tasks"></div></div></main><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('zoz_execution_token')||'';
async function call(url,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw new Error(j.error||'request_failed');return j}
async function refresh(){try{const j=await call('/api/execution');$('status').innerHTML=`<span class="ok">${j.durable?'استقلالية دائمة عبر قاعدة البيانات':'تحذير: التخزين الحالي غير دائم'}</span><br>التحكم من الهاتف: ${j.mobileControl?'نعم':'لا'}<br>آخر دورة: ${j.autonomy.lastCycleAt||'لم تبدأ'}<br>الدورة التالية: ${j.autonomy.nextCycleAt||'مجدولة'}`;$('skills').textContent=Object.values(j.skills).map(x=>x.label).join(' • ');$('tasks').innerHTML=j.tasks.slice().reverse().map(t=>`<div class="task"><b>${escapeHtml(t.title)}</b><br><span class="muted">${escapeHtml(t.stage)} — ${escapeHtml(t.status)}</span></div>`).join('')||'لا توجد مهام بعد';}catch(e){$('status').innerHTML='<span class="warn">تعذر الاتصال: '+escapeHtml(e.message)+'</span>'}}
async function createTask(){const title=$('title').value.trim(),description=$('description').value.trim();if(!title)return alert('اكتب عنوان المهمة');try{await call('/api/execution',{method:'POST',body:JSON.stringify({action:'create_task',title,description,clientRef:$('clientRef').value.trim(),source:'mobile'})});$('title').value='';$('description').value='';await refresh()}catch(e){if(e.message==='unauthorized'){token=prompt('أدخل مفتاح تنفيذ ZOZ AI');if(token){localStorage.setItem('zoz_execution_token',token);return createTask()}}alert(e.message)}}
async function cycle(){try{await call('/api/execution-cycle',{method:'POST'});await refresh()}catch(e){alert(e.message)}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}refresh();setInterval(refresh,60000);
</script></body></html>
